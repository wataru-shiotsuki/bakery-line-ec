<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Example Bakery</title>
  <style>
    body { font: 16px system-ui, sans-serif; max-width: 560px; margin: 32px auto; padding: 0 20px; color: #332b24; }
    h1 { font-size: 1.7rem; }
    label { display: block; margin: 18px 0; }
    select, input, button { box-sizing: border-box; width: 100%; padding: 12px; font: inherit; }
    button { border: 0; border-radius: 6px; background: #8b4c2d; color: white; cursor: pointer; }
    button:disabled { opacity: .5; cursor: default; }
    #payment, #order { margin-top: 24px; }
    #qr { display: block; width: 220px; height: 220px; margin: 18px auto; }
    .muted { color: #655b53; }
  </style>
</head>
<body>
  <h1>Example Bakery</h1>
  <p>Select a product and pickup date.</p>
  <form id="order-form">
    <label>Product <select id="product" required></select></label>
    <label>Pickup date <input id="pickup-date" type="date" required></label>
    <button id="order-button">Order</button>
  </form>
  <section id="payment" hidden>
    <h2>Payment</h2>
    <div id="payment-element"></div>
    <button id="pay-button" type="button">Pay</button>
  </section>
  <section id="order" hidden>
    <h2>Pickup</h2>
    <p id="order-details"></p>
    <p id="order-status" class="muted"></p>
    <img id="qr" alt="Pickup QR code" hidden>
  </section>
  <p id="message" role="alert"></p>
  <script src="https://js.stripe.com/v3/"></script>
  <script>
    const form = document.getElementById('order-form');
    const payment = document.getElementById('payment');
    const orderSection = document.getElementById('order');
    const message = document.getElementById('message');
    let stripe;
    let elements;
    let orderId;

    async function api(url, options) {
      const response = await fetch(url, options);
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || 'Request failed.');
      return data;
    }

    async function loadProducts() {
      const products = await api('/api/products');
      const select = document.getElementById('product');
      select.replaceChildren();
      for (const product of products) {
        const option = document.createElement('option');
        option.value = product.id;
        option.textContent = product.name + ' - JPY ' + product.amount;
        select.append(option);
      }
      document.getElementById('order-button').disabled = !products.length;
      if (!products.length) message.textContent = 'No products available.';
    }

    async function showOrder(id) {
      const order = await api('/api/orders/' + encodeURIComponent(id));
      form.hidden = true;
      payment.hidden = true;
      orderSection.hidden = false;
      document.getElementById('order-details').textContent =
        order.productName + ' - JPY ' + order.amount + ' - Pickup date: ' + order.pickupDate;
      document.getElementById('order-status').textContent =
        order.status === 'pending' ? 'Waiting for payment.' :
        order.status === 'paid' ? 'Show this QR code at pickup.' : 'Picked up.';
      const qr = document.getElementById('qr');
      qr.hidden = !order.qr;
      if (order.qr) qr.src = order.qr;
      if (order.status === 'pending') setTimeout(() => showOrder(id).catch(showError), 3000);
    }

    function showError(error) {
      message.textContent = error.message || 'Please try again.';
    }

    form.addEventListener('submit', async event => {
      event.preventDefault();
      message.textContent = '';
      const button = document.getElementById('order-button');
      button.disabled = true;
      try {
        const config = await api('/api/config');
        if (!config.stripePublishableKey) throw new Error('Payment is not configured.');
        stripe = Stripe(config.stripePublishableKey);
        const order = await api('/api/orders', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            productId: document.getElementById('product').value,
            pickupDate: document.getElementById('pickup-date').value
          })
        });
        orderId = order.orderId;
        elements = stripe.elements({ clientSecret: order.clientSecret });
        elements.create('payment').mount('#payment-element');
        payment.hidden = false;
      } catch (error) {
        showError(error);
        button.disabled = false;
      }
    });

    document.getElementById('pay-button').addEventListener('click', async () => {
      const button = document.getElementById('pay-button');
      button.disabled = true;
      message.textContent = '';
      const returnUrl = new URL('/', location.origin);
      returnUrl.searchParams.set('order', orderId);
      const result = await stripe.confirmPayment({
        elements,
        confirmParams: { return_url: returnUrl.toString() },
        redirect: 'if_required'
      });
      if (result.error) {
        showError(result.error);
        button.disabled = false;
      } else {
        await showOrder(orderId).catch(showError);
      }
    });

    const now = new Date();
    const localDate = new Date(now.getTime() - now.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
    document.getElementById('pickup-date').min = localDate;
    const savedOrder = new URLSearchParams(location.search).get('order');
    if (savedOrder) showOrder(savedOrder).catch(showError);
    else loadProducts().catch(showError);
  </script>
</body>
</html>
